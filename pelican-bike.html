<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<meta name="description" content="用纯 SVG + SMIL 绘制的一只鹈鹕骑着自行车向前飞驰的 2D 动画。">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 26px 20px;
    background: radial-gradient(120% 90% at 50% 0%, #17293d 0%, #0b1220 58%, #070a12 100%);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", sans-serif;
    color: #cfe3f5;
  }
  .stage { width: min(1180px, 100%); }
  .frame {
    border-radius: 26px;
    overflow: hidden;
    background: #9fd7f2;
    box-shadow: 0 34px 80px -34px rgba(0, 0, 0, 0.95),
                0 0 0 1px rgba(255, 255, 255, 0.08),
                inset 0 0 0 1px rgba(255, 255, 255, 0.35);
  }
  svg.scene { display: block; width: 100%; height: auto; }
  .caption {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    align-items: baseline;
    justify-content: space-between;
    margin: 16px 6px 0;
  }
  .caption h1 { margin: 0; font-size: clamp(15px, 1.6vw, 19px); font-weight: 650; color: #eaf4ff; }
  .caption p { margin: 0; font-size: clamp(12px, 1.3vw, 14px); color: #7f9bb5; letter-spacing: 0.02em; }
  @media (max-width: 620px) { .caption { justify-content: center; text-align: center; } }
</style>
</head>
